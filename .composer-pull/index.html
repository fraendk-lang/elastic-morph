<!DOCTYPE html><html><head><meta charset="UTF-8"><script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script></head><body><script>
(async function () {
  try {
    async function fetchGunzipText(urls) {
      var texts = [];
      for (var i = 0; i < urls.length; i++) {
        var r = await fetch(urls[i], { cache: 'no-store' });
        if (!r.ok) throw new Error('fetch failed: ' + urls[i] + ' status ' + r.status);
        texts.push(await r.text());
      }
      var b64 = texts.join('').replace(/[^A-Za-z0-9+/=]/g, '');
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      var out = pako.ungzip(bytes);
      return new TextDecoder().decode(out);
    }
    var shellHtml = await fetchGunzipText(['/shellb64v2.chunk01.txt','/shellb64v2.chunk02.txt']);
    document.open();
    document.write(shellHtml);
    document.close();
    var jsText = await fetchGunzipText(['/appb64v3.chunk01.txt','/appb64v3.chunk02.txt','/appb64v3.chunk03.txt','/appb64v3.chunk04.txt','/appb64v3.chunk05.txt','/appb64v3.chunk06.txt','/appb64v3.chunk07.txt','/appb64v3.chunk08.txt']);
    (0, eval)(jsText);
  } catch (e) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="background:#7a1010;color:#fff;padding:12px;font-family:monospace;">App-Ladefehler: ' + (e && e.message ? e.message : e) + '</div>');
    console.error(e);
  }
})();
</script></body></html>
